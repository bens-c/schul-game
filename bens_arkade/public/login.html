<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Arcade Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Boss Arcade Login</h2>

        <input class="textHold" id="email" type="email" autocomplete="username" placeholder="Email">
        <input id="pass" type="password" autocomplete="current-password" placeholder="Passwort">

        <button class="button" id="loginBtn" type="button">Login</button>
        <button class="button" id="registerBtn" type="button">Registrieren</button>
    </div>

<script>
const emailInput = document.getElementById("email");
const passInput = document.getElementById("pass");
const loginButton = document.getElementById("loginBtn");
const registerButton = document.getElementById("registerBtn");

function getPayload() {
  return {
    email: emailInput.value.trim(),
    pass: passInput.value
  };
}

function setLoadingState(isLoading) {
  loginButton.disabled = isLoading;
  registerButton.disabled = isLoading;
}

async function register() {
  const payload = getPayload();
  if (!payload.email || !payload.pass) {
    alert("Bitte Email und Passwort eingeben.");
    return;
  }

  setLoadingState(true);
  try {
    const response = await fetch("/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (response.ok) {
      alert("Registriert!");
      return;
    }

    alert(`Fehler: ${response.status} ${response.statusText}`);
  } catch {
    alert("Netzwerkfehler beim Registrieren.");
  } finally {
    setLoadingState(false);
  }
}

async function login() {
  const payload = getPayload();
  if (!payload.email || !payload.pass) {
    alert("Bitte Email und Passwort eingeben.");
    return;
  }

  setLoadingState(true);
  try {
    const response = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error(`Fehler: ${response.status} ${response.statusText}`);
    }

    const token = await response.text();
    localStorage.token = token;
    location.href = "index.html";
  } catch (error) {
    alert(error.message || "Login fehlgeschlagen.");
  } finally {
    setLoadingState(false);
  }
}

loginButton.addEventListener("click", login);
registerButton.addEventListener("click", register);
passInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    login();
  }
});
</script>
</body>
</html>
